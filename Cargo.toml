[package]
name = "rust-uo-server"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.31"
byteorder = "1.5.0"
async-std = "1.12.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
